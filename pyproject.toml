[project]
name = "comfyui-ecohash"
version = "1.0.1"
description = "Official EcoHash API nodes for public and dedicated models: image and video generation, image editing, LLM and vision tools, TTS and STT. One EcoHash API key, no local model weights required."
keywords = ["comfyui", "custom-nodes", "ecohash", "image-generation", "video-generation", "image-editing", "llm", "vlm", "tts", "stt"]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests"]

[project.urls]
Repository = "https://github.com/ecohash-ai/ComfyUI-EcoHash"
Documentation = "https://docs.ecohash.com"

[tool.comfy]
PublisherId = "ecohash"
DisplayName = "EcoHash"
Icon = "https://raw.githubusercontent.com/ecohash-ai/ComfyUI-EcoHash/main/assets/icon.png"
