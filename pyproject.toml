[project]
name = "comfyui-ecohash"
version = "1.0.1"
description = "Official EcoHash nodes for ComfyUI: image generation & editing, LLM prompt tools, vision captioning, TTS and STT powered by the EcoHash API."
keywords = ["comfyui", "custom-nodes", "ecohash", "image-generation", "image-editing", "llm", "vlm", "tts", "stt"]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests"]

[project.urls]
Repository = "https://github.com/ecohash-ai/ComfyUI-EcoHash"
Documentation = "https://docs.ecohash.com"

[tool.comfy]
PublisherId = "ecohash"
DisplayName = "EcoHash"
Icon = "https://raw.githubusercontent.com/ecohash-ai/ComfyUI-EcoHash/main/assets/icon.png"
