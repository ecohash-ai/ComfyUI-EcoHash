name: Publish to Comfy Registry
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
permissions:
  # Declaring any permissions block drops every default, so contents: read has to be
  # listed explicitly or actions/checkout cannot fetch this repo. A public repo happens
  # to survive without it (checkout falls back to an anonymous clone); a private one
  # fails with a misleading "Repository not found".
  contents: read
  issues: write
jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
